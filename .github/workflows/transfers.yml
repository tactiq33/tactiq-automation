name: TactIQ Transfers

# ينسخ أحدث الانتقالات الحقيقيّة إلى سيرفرنا، ليعرضها التطبيق بصور اللاعبين
# وشعارات الناديين بدل عناوين أخبار نصّيّة.
#
# ⚠️ مرّتان في اليوم بقصد: الانتقالات لا تتغيّر بالدقيقة، وكلّ جولة = نداء لكلّ
# نادٍ (~19 نداء). جدولة كثيفة هنا تصرف الحصّة على بيانات ثابتة.
#
# مطفأ حتى تصير المتغيّرة APP_DATA_ENABLED = 1 (نفس مفتاح ساحب المباريات).

on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:

concurrency:
  group: tactiq-transfers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Collect and push transfers
        if: vars.APP_DATA_ENABLED == '1'
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node match-bot/push-transfers.js --push

      - name: Skipped
        if: vars.APP_DATA_ENABLED != '1'
        run: echo "APP_DATA_ENABLED is not 1 — transfers collector is off on purpose."
