name: TactIQ App Match Data

# يجمع بيانات المباريات (أحداث · تشكيلات · تقييمات) ويدفعها إلى سيرفرنا، ليقرأها التطبيق.
#
# ── الباقة (المتغيّرة API_PLAN) ──────────────────────────────────────────
#   free (الافتراضيّ): **موقوف**. ثلاثة أسباب مقيسة (2026-11-25):
#     1. المجّانيّ يرفض الموسم الحاليّ («Free plans do not have access to this season»).
#     2. الجولة 1–7 نداءات + 4 لكلّ مباراة، كلّ 5 دقائق ⇒ آلاف النداءات باليوم.
#     3. أوّل ما ينزل مخزون على السيرفر، مؤقّت النتائج بالـWorker بيسأل المزوّد كلّ دقيقة.
#     والتطبيق ما بيوقف: لمّا المخزون فاضي بيقرا المباريات من football-data.org مباشرة.
#   paid: كلّ 5 دقائق متل قبل (تحت سقف 7500/يوم).
# ومفتاح التشغيل العامّ يبقى APP_DATA_ENABLED = 1.
#
# ⚠️ الـWorker بيشغّل هالملفّ كلّ 5 دقائق بين 12:00 و24:00 UTC. على المجّانيّ الجولة
# بتسجّل «موقوفة» بثواني وبلا ولا نداء.
#
# ⚠️ ليش من هنا لا من داخل الـWorker — قياس مسجَّل في الملفّات:
# المزوّد يرفض جزءًا من النداءات القادمة من عناوين Cloudflare (6 من 10 تنجح)،
# بينما تنجح كلّها من عناوين GitHub Actions ومن جهاز عاديّ.

on:
  schedule:
    # ساعات المباريات (12:00–23:59 UTC): كلّ خمس دقائق — للمدفوع فقط
    - cron: '*/5 12-23 * * *'
    # باقي اليوم: مرّة كلّ ساعة، ليبقى جدول اليوم محدَّثًا بلا صرف
    - cron: '0 0-11 * * *'
  workflow_dispatch:

# جولتان معًا تدفعان مخزونين متعارضين ⇒ منع التوازي إلزاميّ
concurrency:
  group: tactiq-app-data
  cancel-in-progress: false

jobs:
  paused:
    if: vars.API_PLAN != 'paid'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Collector is paused on the free plan
        run: echo "::notice title=app-data::Match-details collector is paused — API-Football free plan has no current-season access and cannot fit the volume. The app reads matches from football-data.org meanwhile. Set the variable API_PLAN=paid after upgrading."

  collect:
    if: vars.API_PLAN == 'paid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Collect and push
        if: vars.APP_DATA_ENABLED == '1'
        env:
          API_PLAN: ${{ vars.API_PLAN }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node match-bot/push-app-data.js --push

      - name: Skipped
        if: vars.APP_DATA_ENABLED != '1'
        run: echo "APP_DATA_ENABLED is not 1 — collector is off on purpose."
